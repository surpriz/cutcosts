# ============================================================================
# CloudWaste - Docker Compose Staging Configuration
# ============================================================================
#
# This configuration mirrors PRODUCTION but runs locally for testing.
# Use this to verify your changes will work in PROD before pushing.
#
# Key differences from development:
#   - DEBUG=False (like production)
#   - Health checks enabled (like production)
#   - Multiple workers (like production)
#   - Production Dockerfiles used
#
# Key differences from production:
#   - Ports exposed locally
#   - Uses .env.staging (or .env.prod copy)
#   - No SSL (localhost only)
#   - No Nginx (direct access)
#
# Usage:
#   # Create .env.staging from .env.prod template
#   cp .env.prod .env.staging
#   # Edit .env.staging to use localhost URLs
#
#   # Build and run staging
#   docker compose -f deployment/docker-compose.staging.yml up -d --build
#
#   # Run smoke tests
#   bash deployment/smoke-tests.sh http://localhost:3000
#
#   # Cleanup
#   docker compose -f deployment/docker-compose.staging.yml down -v
#
# ============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudwaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloudwaste}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # Port 5434 to avoid conflict with dev (5433) and prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudwaste}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: staging_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - staging_redis_data:/data
    ports:
      - "6380:6379"  # Different port to avoid conflict with dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_network

  # FastAPI Backend (Production Config)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: staging_backend
    restart: unless-stopped
    # Production-like command with multiple workers
    command: sh -c "./init_encryption.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    volumes:
      - staging_encryption_key:/encryption_key_data
      - ../init_encryption.sh:/app/init_encryption.sh:ro
    ports:
      - "8000:8000"  # Exposed for direct access
    environment:
      # Core
      - DEBUG=False  # Production-like
      - APP_ENV=staging
      - SECRET_KEY=${SECRET_KEY:-staging-secret-key-32chars-minimum}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-staging-jwt-secret-key-32chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # Database
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cloudwaste}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-cloudwaste}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # CORS - localhost for staging
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - FRONTEND_URL=http://localhost:3000
      # Sentry (optional for staging)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - staging_network

  # Celery Worker (Production Config)
  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: staging_celery_worker
    restart: unless-stopped
    command: sh -c "./init_encryption.sh && celery -A app.workers.celery_app worker --loglevel=info --concurrency=4"
    volumes:
      - staging_encryption_key:/encryption_key_data
      - ../init_encryption.sh:/app/init_encryption.sh:ro
    environment:
      - DEBUG=False
      - APP_ENV=staging
      - SECRET_KEY=${SECRET_KEY:-staging-secret-key-32chars-minimum}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-staging-jwt-secret-key-32chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cloudwaste}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-cloudwaste}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - staging_network

  # Celery Beat Scheduler (Production Config)
  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: staging_celery_beat
    restart: unless-stopped
    command: sh -c "./init_encryption.sh && celery -A app.workers.celery_app beat --loglevel=info"
    volumes:
      - staging_encryption_key:/encryption_key_data
      - ../init_encryption.sh:/app/init_encryption.sh:ro
    environment:
      - DEBUG=False
      - APP_ENV=staging
      - SECRET_KEY=${SECRET_KEY:-staging-secret-key-32chars-minimum}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-staging-jwt-secret-key-32chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cloudwaste}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-cloudwaste}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[c]elery.*beat' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - staging_network

  # Next.js Frontend (Production Config)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        # Localhost URL for staging
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_NAME: CloudWaste (Staging)
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: staging
    container_name: staging_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"  # Exposed for direct access
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s  # Frontend takes 70-90s to start
    networks:
      - staging_network

volumes:
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local
  staging_encryption_key:
    driver: local

networks:
  staging_network:
    driver: bridge
